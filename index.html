<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: Tahoma, sans-serif;
    color: #000;
    text-align: center;
    background: #1a1a2e url('bg.png') center center / 100% 100% no-repeat;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 0;
  }

  /* متن */
  .top-text {
    position: absolute;
    top: 25px;
    left: 20px;
    right: 20px;
    bottom: 130px;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(11px, 2.6vh, 16px);
    line-height: 1.7;
    font-weight: bold;
    color: #000;
    text-shadow: 0 1px 6px rgba(255, 255, 255, 0.7);
    overflow: hidden;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  /* نوار پایین */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    padding: 15px 20px max(15px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 0 25px rgba(0, 198, 255, 0.6);
  }

  .progress-bar {
    width: 85%;
    max-width: 320px;
    height: 12px;
    background: rgba(255, 255, 255, 0.15);
    border: 1.5px solid #fff;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
  }

  .progress-fill {
    height: 100%;
    width: 100%;
    background: #e60000;
    transform-origin: right center;
    transform: scaleX(0);
    animation: fillUp 1.5s ease-out forwards;
  }

  @keyframes fillUp {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
</style>
</head>
<body>

  <div class="top-text">
    سلام! این یک متن بلندتر است که در بالای صفحه روی گوشی نمایش داده می‌شود. هر چقدر متن می‌خواهی اینجا بگذار.
  </div>

  <div class="bottom-bar">
    <img src="logo.png" alt="لوگو" class="logo">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

</body>
</html>
