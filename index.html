<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    height: 100%;
    background: #1a1a2e url('bg.png') center center / cover no-repeat fixed;
    -webkit-background-size: cover;
    background-size: cover;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: Tahoma, sans-serif;
    color: #fff;
    position: relative;
    text-align: center;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 0;
    pointer-events: none;
  }

  .top-text {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-size: clamp(20px, 5vw, 28px);
    line-height: 2;
    font-weight: bold;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .bottom-bar {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 18px 20px;
    padding-bottom: max(18px, env(safe-area-inset-bottom));
    background: rgba(0, 0, 0, 0.65);
    border-top: 2px solid #fff;
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .logo {
    width: clamp(80px, 22vw, 110px);
    height: clamp(80px, 22vw, 110px);
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 0 25px rgba(0, 198, 255, 0.6);
    background: rgba(255, 255, 255, 0.1);
  }

  /* نوار پیشرفت مثل نصب ویندوز */
  .progress-bar {
    width: min(90%, 420px);
    height: 22px;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid #fff;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6);
  }

  .progress-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(
      to right,
      #00c6ff 0%,
      #00c6ff 25%,
      #0090ff 25%,
      #0090ff 50%,
      #00c6ff 50%,
      #00c6ff 75%,
      #0090ff 75%,
      #0090ff 100%
    );
    background-size: 60px 100%;
    animation: fillUp 1.5s ease-out forwards, stripesMove 0.6s linear infinite;
    transform-origin: right center;
    transform: scaleX(0);
  }

  @keyframes fillUp {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  @keyframes stripesMove {
    from { background-position: 0 0; }
    to   { background-position: -60px 0; }
  }
</style>
</head>
<body>
  <div class="top-text">
    سلام! این یک متن بلندتر است که در بالای صفحه روی گوشی نمایش داده می‌شود.
  </div>

  <div class="bottom-bar">
    <img src="logo.png" alt="لوگو" class="logo">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
</body>
</html>
