<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    font-family: Tahoma, sans-serif;
    color: #000;
    position: relative;
    text-align: center;
    overflow: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: #1a1a2e url('bg.png') center center / 100% 100% no-repeat;
    z-index: -2;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: -1;
  }

  /* متن یه‌کم پایین‌تر از بالا */
  .top-text {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 20px 20px;   /* فاصله از بالا */
    font-size: clamp(16px, 4.5vw, 26px);
    line-height: 1.8;
    font-weight: bold;
    color: #000;
    text-shadow: 0 1px 6px rgba(255, 255, 255, 0.6);
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
    overflow: hidden;
  }

  .bottom-bar {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 16px 20px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: clamp(65px, 18vw, 90px);
    height: clamp(65px, 18vw, 90px);
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 0 25px rgba(0, 198, 255, 0.6);
  }

  .progress-bar {
    width: min(85%, 340px);
    height: 12px;
    background: rgba(255, 255, 255, 0.15);
    border: 1.5px solid #fff;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
  }

  .progress-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #e60000;
    transform-origin: right center;
    transform: scaleX(0);
    animation: fillUp 1.5s ease-out forwards;
  }

  @keyframes fillUp {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-overlay"></div>

  <div class="top-text">
    سلام! این یک متن بلندتر است که در بالای صفحه روی گوشی نمایش داده می‌شود.
  </div>

  <div class="bottom-bar">
    <img src="logo.png" alt="لوگو" class="logo">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
</body>
</html>
